<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
      <link rel="icon" href="favicon.png" type="image/png">
  <title>Screenshot Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
      
</head>
<body>
  <div style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;" 
     onmouseover="this.querySelector('span').style.opacity='1'; this.querySelector('span').style.transform='translateY(0)';" 
     onmouseout="this.querySelector('span').style.opacity='0'; this.querySelector('span').style.transform='translateY(5px)';"
>
    
    <span style="opacity: 0; background-color: #ffffff; color: #444444; text-align: center; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; border: 1px solid #ebebeb; transform: translateY(5px); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; white-space: nowrap; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        Made by Ellie
    </span>

    <a href="https://ellie.city" target="_blank" style="width: 20px; height: 20px; background-color: #56bc8a; border-radius: 50%; display: block; transition: transform 0.2s ease; box-shadow: 0 2px 8px rgba(1, 168, 220, 0.2);" 
       onmouseover="this.style.transform='scale(1.15)'" 
       onmouseout="this.style.transform='scale(1)'">
    </a>
</div>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1>Screenshots<br>Garden ෴</h1>
      <p class="description">
      Each screenshot is a petal 🌸, a leaf 🍃, or sometimes a bug 🐞 that I plucked from the wild internet. Sit awhile, scroll, and maybe you’ll find something blooming just for you. 🌺 🌱

      </p>
      <marquee behavior="scroll" direction="left" class="marquee">෴𖡼𖤣𖥧෴𖡼𓋼↟𖠰෴˚☀︎ᨒ↟𖠰෴𖤣𖥧𓋼𓍊☆.෴𓋼𓍊 𓆏 𓍊෴𓋼𓍊.𖠰☆</marquee>
      <div class="links">
        <a href="https://elliemie.se">Ellie S.</a>
      </div>
    </aside>

    <!-- Main gallery -->
    <main class="gallery" id="gallery">
      <!-- JS will populate images here -->
    </main>
  </div>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="" alt="">
    <span id="lightbox-close">✕</span>
  </div>

  <script src="script.js"></script>
  <div id="scrollTopBtn">⤴︎</div>
</body>
</html>
